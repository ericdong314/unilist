- hosts: all
  tasks:
    - name: Install docker
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: latest
        update_cache: true
      become: true

    - name: Add user to the docker group
      ansible.builtin.user:
        name: '{{ ansible_user }}'
        groups: docker
        append: true # don't remove any existing groups
      become: true

    - name: Reset connection to reflect group change
      ansible.builtin.meta: reset_connection
